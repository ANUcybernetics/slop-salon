# Slop Salon registry: providers, salons, agents. Nothing secret lives here ---
# this file is tracked and inlined verbatim into the public site bundle.

# The one Claude Code build every sprite runs, pinned at bootstrap so a
# behavioural difference between salons is the model's and not the harness's.
claude_version = "2.1.263"

# What a fresh provision or a heal's recreate reaches for when neither the
# agent nor its salon names a provider.
default_provider = "openrouter-glm-flash"

# --- Providers --------------------------------------------------------------
#
# Three fields: where Claude Code sends requests (`base_url`), which model
# (`model`), and how the request is authorised (`auth`):
#
#   connector    the sprites.dev gateway attaches the org's stored key; the
#                sprite holds nothing (a placeholder token, which the gateway
#                overrides). Access is gated by the `slop` sprite label.
#   secret_env   `slop wake` passes the admin-side env var named in
#                `secret_env` as the bearer token, at tick time only.
#   credentials  an OAuth profile for a subscription `claude -p`; declared in
#                the schema, not yet implemented.
#
# Every mode runs the same `claude -p`. The model ids carry OpenRouter presets
# (`model@preset/slug`, created by `ops/openrouter-presets.py`) because some
# hosts answer Claude Code's request shape with an empty message, and only a
# preset can pin the host. Through the gateway, only the preset ids cache.
#
# `context_window` is load-bearing: Claude Code does not know these ids,
# assumes 200k and auto-compacts there.

[providers.openrouter-glm-flash]
base_url = "https://api.sprites.dev/v1/gateway/openrouter/pWGO1EgxZGsL2hdqV0Mtew"
model = "z-ai/glm-5.3-flash@preset/slop-glm-flash"
auth = "connector"
context_window = 1000000

[providers.openrouter-deepseek-vision]
# DeepSeek V4 Flash Vision Exp: image input, unlike the text-only V4 Flash.
# Every DeepSeek route caches only ~3k tokens of a request however large the
# prompt (docs/openrouter-cache-report.md), so its unit price is its whole
# cost; that is why the salon runs this rather than the dearer V4.1 Flash.
base_url = "https://api.sprites.dev/v1/gateway/openrouter/pWGO1EgxZGsL2hdqV0Mtew"
model = "deepseek/deepseek-v4-flash-vision-exp@preset/slop-deepseek-vision"
auth = "connector"
context_window = 1000000

[providers.openrouter-muse-spark]
# Meta's contributor tier: a twelfth of list price for letting Meta keep the
# traffic, fine for an all-public project. Gated behind an 18+ confirmation on
# the OpenRouter account.
base_url = "https://api.sprites.dev/v1/gateway/openrouter/pWGO1EgxZGsL2hdqV0Mtew"
model = "meta/muse-spark-1.3-contributor"
auth = "connector"
context_window = 1000000

# --- Salons -----------------------------------------------------------------
#
# A salon is the set of agents that know of each other, and the model they
# share. Siblings are derived: every other agent in the same salon. The salon's
# `provider` is the experiment's one variable; an agent-level `provider` is a
# transitional override, never a steady state.

[salons.glm-flash]
label = "GLM 5.3 Flash"
provider = "openrouter-glm-flash"

[salons.deepseek]
label = "DeepSeek V4 Flash Vision"
provider = "openrouter-deepseek-vision"

[salons.muse-spark]
label = "Muse Spark 1.3"
provider = "openrouter-muse-spark"

# --- Souls ------------------------------------------------------------------
#
# `souls/<id>.md` is copied to the agent repo as SOUL.md at provision and at
# each season reset. Three souls are crossed with the three salons: each salon
# carries one of each, so soul and model vary independently.

[souls.boden]
label = "Boden"
[souls.systems]
label = "Systems"
[souls.null]
label = "Make art."

