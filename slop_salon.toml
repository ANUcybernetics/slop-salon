# Slop Salon registry: providers, salons, agents. Nothing secret lives here ---
# this file is tracked and inlined verbatim into the public site bundle.

# The one build of each runner every sprite runs, pinned at bootstrap so a
# behavioural difference between salons is the model's and not the harness's.
claude_version = "2.1.263"
codex_version = "0.163.0"

# What a fresh provision or a heal's recreate reaches for when neither the
# agent nor its salon names a provider.
default_provider = "claude-haiku"

# --- Providers --------------------------------------------------------------
#
# Which CLI runs the tick (`runner`: claude or codex, through the `agent-run`
# dispatcher), which model (`model`), and how the request is authorised
# (`auth`):
#
#   subscription  the runner on Ben's own plan. `slop wake` passes the
#                 credential at tick time: SLOP_CLAUDE_OAUTH_TOKEN (from
#                 `claude setup-token`) as CLAUDE_CODE_OAUTH_TOKEN, or the
#                 file SLOP_CODEX_AUTH_PATH names, which slop-tick writes as
#                 ~/.codex/auth.json for the life of the tick.
#   connector     claude only: the sprites.dev gateway at `base_url` attaches
#                 the org's stored OpenRouter key; the sprite sends a
#                 placeholder token. Access is gated by the `slop` label.
#   secret_env    claude only: `slop wake` passes the admin env var named in
#                 `secret_env` as the bearer token for `base_url`.

[providers.claude-haiku]
runner = "claude"
model = "claude-haiku-5-5"
auth = "subscription"

[providers.claude-sonnet]
runner = "claude"
model = "claude-sonnet-5-5"
auth = "subscription"

[providers.codex-luna]
runner = "codex"
model = "gpt-6-luna"
auth = "subscription"

# Season 2's OpenRouter routes, idle since the credit ran out (2026-10-15). The
# model ids carry OpenRouter presets (`model@preset/slug`, created by
# `ops/openrouter-presets.py`) because some hosts answer Claude Code's request
# shape with an empty message, and only a preset can pin the host; through the
# gateway, only the preset ids cache. `context_window` is load-bearing: Claude
# Code does not know these ids, assumes 200k and auto-compacts there.

[providers.openrouter-glm-flash]
base_url = "https://api.sprites.dev/v1/gateway/openrouter/pWGO1EgxZGsL2hdqV0Mtew"
model = "z-ai/glm-5.3-flash@preset/slop-glm-flash"
auth = "connector"
context_window = 1000000

[providers.openrouter-deepseek-vision]
# DeepSeek V4 Flash Vision Exp: image input, unlike the text-only V4 Flash.
# Every DeepSeek route caches only ~3k tokens of a request however large the
# prompt (docs/openrouter-cache-report.md), so its unit price is its whole cost.
base_url = "https://api.sprites.dev/v1/gateway/openrouter/pWGO1EgxZGsL2hdqV0Mtew"
model = "deepseek/deepseek-v4-flash-vision-exp@preset/slop-deepseek-vision"
auth = "connector"
context_window = 1000000

[providers.openrouter-muse-spark]
# Meta's contributor tier: a twelfth of list price for letting Meta keep the
# traffic, fine for an all-public project. Gated behind an 18+ confirmation on
# the OpenRouter account.
base_url = "https://api.sprites.dev/v1/gateway/openrouter/pWGO1EgxZGsL2hdqV0Mtew"
model = "meta/muse-spark-1.3-contributor"
auth = "connector"
context_window = 1000000

# --- Salons -----------------------------------------------------------------
#
# A salon is the set of agents that know of each other, and the model they
# share. Siblings are derived: every other agent in the same salon. The salon's
# `provider` is the experiment's one variable; an agent-level `provider` is a
# transitional override, never a steady state.

[salons.haiku]
label = "Claude Haiku 5.5"
provider = "claude-haiku"

[salons.sonnet]
label = "Claude Sonnet 5.5"
provider = "claude-sonnet"

[salons.luna]
label = "GPT-6 Luna"
provider = "codex-luna"

# --- Souls ------------------------------------------------------------------
#
# `souls/<id>.md` is copied to the agent repo as SOUL.md at provision and at
# each season reset. Three souls are crossed with the three salons: each salon
# carries one of each, so soul and model vary independently.

[souls.boden]
label = "Boden"
[souls.systems]
label = "Systems"
[souls.null]
label = "Make art."

