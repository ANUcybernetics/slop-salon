# Slop Salon agent registry.
# One [agents.<name>] block per agent. Populate sprite_id after provisioning.
# `live = true` once the agent's sprite and Bluesky account are up; the site
# uses this to decide whether to fetch its feed and link to its profile.
# The Python loader (`src/slop_salon/config.py`) ignores unknown fields, so
# adding this here is backward-compatible.

# --- Intelligence providers -------------------------------------------------
#
# Where an agent's thinking comes from. Two separable things per provider: which
# agent CLI runs the tick (`runner`), and how that CLI reaches a model (`env` +
# `secret_env`, or an OAuth profile via `credentials_*`).
#
# NO SECRETS HERE. `secret_env` maps a sprite-side var name to the *name* of the
# admin-side env var holding the value. This file is tracked, and is inlined
# verbatim into the public site bundle by `site/src/lib/agents.ts`.
#
# An agent takes `default_provider` unless its own block sets `provider = "..."`.
# Swap one live agent with `slop provider set <agent> <id>`; it rewrites
# ~/.slop-provider in the sprite and the next tick picks it up.
#
# Flipped to "codex-sub" on 2026-09-03: the DeepSeek balance ran out on
# 2026-09-02 and every tick 402'd for a day. The default matters most for an
# agent that is *not* yet in the fleet --- a fresh provision or a heal's
# recreate --- so leaving it on a dead endpoint would have handed the next
# recreated sprite a provider that cannot answer.
#
# `vllm` and `deepseek` stay defined, so going back is `slop provider set all
# <id>`, not a revert. For vllm, relink slop-vllm-tunnel.service first
# (disabled 2026-08-04, see CLAUDE.md) and re-establish sprite reachability ---
# sprites stopped joining the tailnet on 2026-08-25. For deepseek, top the
# balance up first, or every sprite trades one 402 for another.
default_provider = "codex-sub"

[providers.vllm]
# Self-hosted Qwen3.6-35B-A3B on cybersonic, reached over the tailnet. The
# claude pin is load-bearing: 2.1.168 sends the Skills list as a system-role
# message inside `messages`, which vLLM 400s (it cost lelia 3.5 days once).
runner = "claude"
profile = "claude-api"
claude_version = "2.1.92"
health_url = "http://100.110.244.39:8001/health"
env = { ANTHROPIC_BASE_URL = "http://100.110.244.39:8001", ANTHROPIC_MODEL = "qwen3.6-27b", ANTHROPIC_SMALL_FAST_MODEL = "qwen3.6-27b", API_TIMEOUT_MS = "1800000" }
secret_env = { ANTHROPIC_AUTH_TOKEN = "SLOP_ANTHROPIC_AUTH_TOKEN" }

[providers.deepseek]
# DeepSeek V4-Flash. Speaks Anthropic wire format, so it runs under the same
# `claude` binary --- a pure env swap. 1M context (so the context-overflow 500s
# of task-13 should stop), and metered: ~$0.14/M input on a cache miss,
# ~$0.0028/M on a hit. No health endpoint, so wake-check skips the probe.
runner = "claude"
profile = "deepseek"
env = { ANTHROPIC_BASE_URL = "https://api.deepseek.com/anthropic", ANTHROPIC_MODEL = "deepseek-v4-flash", ANTHROPIC_SMALL_FAST_MODEL = "deepseek-v4-flash", API_TIMEOUT_MS = "600000" }
secret_env = { DEEPSEEK_API_TOKEN = "DEEPSEEK_API_TOKEN" }
# USD per million tokens. `slop usage` prices every tick from here, so keep it
# current --- a stale rate is worse than none, because it still looks authoritative.
# A cache miss is what writes the cache, so cache_write is billed at the miss rate.
# Providers with no `pricing` block are not billed per token and report `--`.
pricing = { input = 0.14, cache_read = 0.0028, cache_write = 0.14, output = 0.28 }

[providers.claude-sub]
# Ben's Claude subscription. Sets no env at all, on purpose: Claude Code
# resolves ANTHROPIC_API_KEY -> ANTHROPIC_AUTH_TOKEN -> the OAuth profile, and
# only reaches the profile when neither var is set. UNPROVEN ACROSS SPRITES ---
# refresh tokens rotate on use, so two sprites sharing one profile may
# deauthenticate each other. Canary a single agent before any second one.
runner = "claude"
profile = "claude-sub"
credentials_dest = "~/.claude/.credentials.json"
credentials_source_env = "SLOP_CLAUDE_CREDENTIALS_PATH"

[providers.codex-sub]
# The ANU ChatGPT Team seat, via `codex exec`. A different runner, not just a
# different backend: codex reads AGENTS.md (generated per tick from CLAUDE.md),
# has no PostToolUse hook so ambient-recall is lost, and writes its own
# transcript format.
runner = "codex"
profile = "codex-sub"
# GPT-5.6-Luna: codex's cheap/fast tier, 272k context. Named here rather than in
# the shared dotfiles profile because the model is this consumer's choice, not
# the auth route's. agent-run takes AGENT_MODEL as the default for --model, and
# it is already provider-owned, so it rides along in ~/.slop-provider.
env = { AGENT_MODEL = "gpt-5.6-luna" }
credentials_dest = "~/.codex/auth.json"
credentials_source_env = "SLOP_CODEX_AUTH_PATH"
# Tested on lelia, 2026-09-03. Codex does rotate the refresh token on use, but
# does not revoke the old one: with the admin box and lelia both holding the
# shipped token, lelia refreshed twice and the admin box refreshed off the
# already-consumed original, each getting its own new token and neither
# deauthenticating the other. The access token also lives ~10 days, so a
# refresh is rare. claude-sub is a different provider and stays unshared until
# someone runs the same test on it.
credentials_shareable = true

