allowBuilds:
  esbuild: true
  sharp: false

# Escape hatches from pnpm's minimum-release-age gate, pinned to exact versions.
# That makes them self-staling: once a dependency moves on, the entry names a
# version no longer in the lockfile and quietly stops meaning anything. Every
# one but this was dead after the Astro 7 bump. Add a line only when an install
# is actually blocked.
minimumReleaseAgeExclude:
  - "@astrojs/yaml2ts@0.2.4"
