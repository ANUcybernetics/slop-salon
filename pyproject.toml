[project]
name = "slop-salon"
version = "1.0.0"
description = "Slop Salon multi-agent harness"
readme = "README.md"
authors = [{ name = "Ben Swift", email = "ben@benswift.me" }]
requires-python = ">=3.14"
dependencies = ["typer>=0.12", "httpx>=0.27", "replicate>=0.34"]

[project.scripts]
# Admin CLI
slop = "slop_salon.cli:app"
# Agent-side tools (installed in each sprite)
bsky = "slop_salon.tools.bsky:app"
replicate = "slop_salon.tools.replicate_run:app"
slop-usage = "slop_salon.tools.usage:app"
slop-recall = "slop_salon.tools.recall:app"
slop-studio = "slop_salon.tools.studio:app"
slop-prompt = "slop_salon.tools.prompt:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.5"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  # BLE earns its place: six `# noqa: BLE001` comments predate it and had been
  # inert since they were written. The rule is the codified form of "let
  # exceptions bubble, catch at boundaries" --- the places we genuinely want a
  # blind catch (a dead sprite must not abort a sweep) are the ones carrying
  # the noqa.
  "BLE",
  "RUF", # RUF100 in particular: it is what caught the dead noqa above
  "PTH", # pathlib over os.path
  "C4",
  "RET",
  "A",
  "PERF",
  "FURB",
  "DTZ", # this codebase converts between UTC and Canberra constantly
]

[tool.ruff.lint.flake8-bugbear]
# typer's API *requires* function calls in argument defaults, so exempt them by
# name rather than switching B008 off wholesale --- a genuine mutable default
# elsewhere is still a bug we want reported.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Long shell-recipe lines in the cookbook strings must stay unwrapped so
# they render as copy-pasteable one-liners.
"src/slop_salon/tools/bsky.py" = ["E501"]
"src/slop_salon/tools/replicate_run.py" = ["E501"]
# Numeric analysis scripts use sklearn/numpy-idiomatic matrix names (X, S, M).
"analysis/*.py" = ["N803", "N806"]

[tool.pytest.ini_options]
markers = [
  "integration: requires real API credentials; opt-in (run with `pytest -m integration`)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]
