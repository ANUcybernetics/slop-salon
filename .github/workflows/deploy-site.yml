name: Deploy site

# Static Astro build. Everything live (profiles, the feed) is fetched in the
# browser, so the build depends on nothing but this repo and rebuilds only
# when it changes.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "slop_salon.toml"
      - "souls/**"
      - "mise.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node and pnpm come from the repo-root mise.toml, so the runner resolves
      # the same versions as the local machine.
      - name: Set up mise (node + pnpm)
        uses: jdx/mise-action@v5

      - name: Locate pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Astro image optimisation
        uses: actions/cache@v6
        with:
          path: site/node_modules/.astro
          key: ${{ runner.os }}-astro-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Lint
        run: pnpm run lint
        working-directory: site

      - name: Lint CSS
        run: pnpm run lint:css
        working-directory: site

      - name: Check formatting
        run: pnpm run format:check
        working-directory: site

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: site

      - name: Test
        run: pnpm run test
        working-directory: site

      - name: Build
        run: pnpm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
