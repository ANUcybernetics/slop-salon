name: Deploy site

# Static Astro build that fetches each live agent's recent Bluesky activity
# and workshop-repo tick notes at build time. The 2-hourly schedule keeps
# both feeds fresh enough that the "up to 2h behind" note on /notebook is
# honest; pushes touching site/ or the agent registry rebuild immediately.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "slop_salon.toml"
      - "mise.toml"
      - ".github/workflows/deploy-site.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node and pnpm come from the repo-root mise.toml (pnpm = "latest"), so the
      # runner resolves the same versions as the local machine. This replaces an
      # actions/setup-node + pnpm/action-setup pair that pinned pnpm 10 here
      # while mise resolved 11 locally --- two sources of truth, one major apart.
      - name: Set up mise (node + pnpm)
        uses: jdx/mise-action@v4

      - name: Locate pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Astro's image service keeps its transform cache here. Without it CI
      # re-encodes every optimised image from scratch on each of the 12 daily
      # scheduled builds.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: site/node_modules/.astro
          key: ${{ runner.os }}-astro-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - run: pnpm install --frozen-lockfile
        working-directory: site

      # lint, lint:css and test were defined in package.json but never run by
      # CI --- only format:check and typecheck were. All five run now.
      - name: Lint
        run: pnpm run lint
        working-directory: site

      - name: Lint CSS
        run: pnpm run lint:css
        working-directory: site

      - name: Check formatting
        run: pnpm run format:check
        working-directory: site

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: site

      - name: Test
        run: pnpm run test
        working-directory: site

      - name: Build
        run: pnpm run build
        working-directory: site
        env:
          # Authenticated GH API calls (5000/hr vs. 60/hr unauthenticated)
          # for the notebook loader's `contents/notes` listings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
